<h1>{{ 'adminPanel.sidebar.userGroups' | translate }}</h1>

@if (loadingUserGroups) {
  <div class="d-flex flex-row justify-content-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">{{ 'problem.loading' | translate }}</span>
    </div>
  </div>
} @else {
  @for (group of userGroups; track group.id) {
    <app-principal-card
      [principal]="group"
    />
  }
}
