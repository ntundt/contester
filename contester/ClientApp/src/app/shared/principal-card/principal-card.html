<div class="d-flex align-items-center gap-3 p-1 rounded transition-all principal-holder"
     [routerLink]="[ (principal.type === 'Group' ? '/admin-panel/user-groups' : '/user'), principal.id]"
     style="cursor: pointer;">

  <div class="position-relative flex-shrink-0">
    @if (principal.profilePictureUrl) {
      <img
        class="rounded-circle border border-light shadow-sm"
        style="width: 44px; height: 44px; object-fit: cover;"
        src="{{ principal.profilePictureUrl }}"
        alt="{{ principal.displayName }}"
      />
    } @else {
      <div [class]="principal.type === 'Group' ? 'bg-info bg-opacity-10 text-info' : 'bg-secondary bg-opacity-10 text-secondary'"
           class="rounded-circle d-flex align-items-center justify-content-center fw-semibold shadow-sm border border-light"
           style="width: 44px; height: 44px; font-size: 0.95rem; letter-spacing: 0.5px;">
        {{ principal.displayName | slice:0:2 | uppercase }}
      </div>
    }
  </div>

  <div class="d-flex flex-column min-w-0">
    <h6 class="mb-0 text-dark fw-semibold text-truncate text-hover-blue" style="font-size: 0.9rem;">
      {{ principal.displayName }}
    </h6>
    <span class="text-muted d-flex align-items-center gap-1" style="font-size: 0.75rem; margin-top: 1px;">
      @if (principal.type === 'Group') {
        <span>Група</span>
      } @else {
        <span>Карыстальнік</span>
      }
    </span>
  </div>
</div>
